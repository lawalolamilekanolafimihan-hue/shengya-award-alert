name: Weekly Award Alert

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 7:00am Lagos time
  workflow_dispatch:      # Lets you run it any time with a button

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run award alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python award_alert.py
      - name: Save list of stories already sent
        run: |
          git config user.name "award-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen stories"
          git push
